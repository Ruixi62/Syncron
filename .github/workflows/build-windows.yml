name: Build Syncron Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "tests/**"
      - "build_client.py"
      - "pyproject.toml"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: syncron
          POSTGRES_PASSWORD: syncron
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U syncron -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SYNCRON_TEST_DATABASE_URL: postgresql+asyncpg://syncron:syncron@127.0.0.1:5433/postgres
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dependances systeme Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libdbus-1-3 libxkbcommon0

      - name: Installer les dependances Python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[client,server,dev]"

      - name: Executer les tests
        run: python -m pytest

  build:
    needs: tests
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verifier que le tag correspond a la version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $match = Select-String -Path src/syncron_core/__init__.py -Pattern '__version__ = "(.+)"'
          $version = $match.Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Le tag ${{ github.ref_name }} ne correspond pas a la version $version"
          }

      - name: Installer les dependances Python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[client,dev]"

      - name: Construire Syncron
        run: python build_client.py --server-url https://syncron.guideon.dev

      - name: Creer l'archive et la somme de controle
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Syncron -DestinationPath Syncron-windows.zip
          $hash = (Get-FileHash Syncron-windows.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Syncron-windows.zip" | Out-File -Encoding ascii Syncron-windows.zip.sha256

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: Syncron-Windows
          path: Syncron-windows.zip
          retention-days: 30

      - name: Publier la Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Syncron-windows.zip
            Syncron-windows.zip.sha256
