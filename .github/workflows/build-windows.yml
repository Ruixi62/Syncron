name: Build Syncron Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "build_client.py"
      - "pyproject.toml"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[client,server,dev]"

      - name: Exécuter les tests
        run: python -m pytest

      - name: Construire Syncron
        run: python build_client.py --server-url https://syncron.guideon.dev

      - name: Créer l'archive Windows
        run: Compress-Archive -Path dist/Syncron -DestinationPath Syncron-windows.zip

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: Syncron-Windows
          path: Syncron-windows.zip
          retention-days: 30