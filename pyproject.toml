[project]
name = "syncron"
version = "4.1.0"
description = "Syncron — boîte à outils connectée des joueurs NationsGlory (client PySide6 + API FastAPI)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "httpx>=0.27",
    "pillow>=10.4",
    "python-multipart>=0.0.9",
    "tzdata>=2024.1",
]
client = [
    "PySide6>=6.7",
    "httpx>=0.27",
    "keyring>=25",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "pyinstaller>=6.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.per-file-ignores]
"src/syncron_client/platform/tool.py" = ["B027"]
"src/syncron_server/migrations/versions/*" = ["E501"]
